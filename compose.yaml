services:
  veil:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      VEIL_DATA_DIR: /data
      VEIL_MODEL_PATH: /models/yunet.onnx
      VEIL_SECURE_COOKIE: ${VEIL_SECURE_COOKIE:-false}
      VEIL_ORIGIN: ${VEIL_ORIGIN:-}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - config:/config
      - data:/data
      - models:/models
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  config:
  data:
  models:
