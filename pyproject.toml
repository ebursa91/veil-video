[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "veil-video"
version = "0.1.0"
description = "A private, self-hosted video workbench. Blur faces on your GPU."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.37,<1",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=25.1,<26",
  "itsdangerous>=2.2,<3",
  "python-dotenv>=1.1,<2",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27"]
cpu = ["onnxruntime>=1.21,<1.27"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
veil = "veil.cli:main"

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]

[tool.hatch.build.targets.wheel]
packages = ["veil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
